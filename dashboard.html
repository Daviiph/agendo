<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#09090b">
  <link rel="icon" href="/logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png">
  <title>Panel · Agendo</title>
</head>
<body class="min-h-screen md:pl-64">
  <aside class="no-print fixed inset-y-0 left-0 z-30 hidden w-64 flex-col border-r border-white/5 bg-zinc-950 p-4 md:flex">
    <a href="/dashboard" class="flex items-center gap-2.5 px-2 font-display text-xl font-extrabold"><img src="/logo.svg" class="h-9 w-9" alt="">Agendo</a>
    <select data-sel-negocio class="inp mt-6 py-2.5 text-sm"></select>
    <nav id="menuLateral" class="mt-6 flex flex-col gap-1"></nav>
    <div class="mt-auto space-y-1">
      <a href="/registro?nuevo=1" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-zinc-400 hover:bg-white/5 hover:text-white">+ Otro negocio</a>
      <button data-salir class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-zinc-400 hover:bg-white/5 hover:text-white"></button>
    </div>
  </aside>

  <header class="no-print sticky top-0 z-20 border-b border-white/5 bg-zinc-950/85 backdrop-blur">
    <div class="flex items-center gap-2 px-4 py-3 md:px-8">
      <img src="/logo.svg" class="h-8 w-8 md:hidden" alt="">
      <h1 id="tituloVista" class="font-display text-lg font-bold md:text-2xl"></h1>
      <select data-sel-negocio class="ml-2 min-w-0 max-w-[40%] rounded-xl border border-white/10 bg-zinc-900 px-2 py-1.5 text-sm md:hidden"></select>
      <div class="ml-auto flex items-center gap-1">
        <button id="pdf" class="btn-ghost btn-sm hidden"></button>
        <div class="relative">
          <button id="campana" aria-label="Notificaciones" class="relative grid h-10 w-10 place-items-center rounded-full hover:bg-white/5">
            <span id="campanaIcono"></span>
            <span id="badge" class="absolute right-0.5 top-0.5 hidden min-w-5 rounded-full bg-red-600 px-1 text-center text-xs font-bold leading-5 text-white">0</span>
          </button>
          <div id="panelNotif" class="absolute right-0 mt-2 hidden w-80 rounded-3xl bg-zinc-900 p-2 shadow-2xl ring-1 ring-white/10">
            <p class="px-3 py-2 text-xs font-semibold uppercase tracking-wider text-zinc-500">Nuevas reservas</p>
            <ul id="listaNotif" class="max-h-80 overflow-y-auto"><li class="px-3 py-3 text-sm text-zinc-500">Sin novedades</li></ul>
          </div>
        </div>
        <button data-salir class="grid h-10 w-10 place-items-center rounded-full text-zinc-400 hover:bg-white/5 md:hidden" aria-label="Salir"></button>
      </div>
    </div>
  </header>

  <main class="px-4 pb-28 pt-6 md:px-8 md:pb-10">
    <div class="print-only mb-5 border-b-2 border-black pb-3">
      <div class="flex items-center gap-3"><span id="printLogo" class="grid h-12 w-12 place-items-center rounded-xl border-2 border-black text-lg font-extrabold"></span>
        <div><p id="printNombre" class="text-2xl font-bold"></p><p id="printSub" class="text-sm"></p></div></div>
    </div>
    <div id="vista"></div>
  </main>

  <nav id="menuInferior" class="no-print fixed inset-x-0 bottom-0 z-30 grid grid-cols-6 border-t border-white/10 bg-zinc-950/95 pb-[env(safe-area-inset-bottom)] backdrop-blur md:hidden"></nav>
  <div id="modal" class="no-print fixed inset-0 z-50 hidden items-end justify-center bg-black/70 p-0 backdrop-blur-sm sm:items-center sm:p-4"></div>
  <script type="module" src="/src/dashboard.js"></script>
</body>
</html>
