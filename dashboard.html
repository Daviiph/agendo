<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.svg"><title>Panel · Agendo</title>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <header class="no-print sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center gap-2 px-4 py-3">
      <a href="/dashboard.html" class="flex items-center gap-2 font-extrabold"><img src="/logo.svg" class="h-8 w-8" alt=""><span class="hidden sm:inline">Agendo</span></a>
      <select id="selNegocio" class="ml-2 min-w-0 max-w-[40%] rounded-lg border border-slate-300 px-2 py-1.5 text-sm"></select>
      <div class="ml-auto flex items-center gap-1">
        <a id="linkReservas" target="_blank" class="hidden rounded-lg px-3 py-1.5 text-sm font-semibold hover:bg-slate-100 md:inline">Ver reservas</a>
        <a href="/config.html" class="rounded-lg px-3 py-1.5 text-sm font-semibold hover:bg-slate-100">Configurar</a>
        <div class="relative">
          <button id="campana" aria-label="Notificaciones" class="relative grid h-10 w-10 place-items-center rounded-full hover:bg-slate-100">
            <svg id="campanaIcono" viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span id="badge" class="absolute right-1 top-1 hidden min-w-5 rounded-full bg-red-600 px-1 text-center text-xs font-bold leading-5 text-white">0</span>
          </button>
          <div id="panelNotif" class="absolute right-0 mt-2 hidden w-80 rounded-2xl bg-white p-2 shadow-xl ring-1 ring-slate-200">
            <p class="px-2 py-1 text-xs font-semibold uppercase text-slate-500">Nuevas reservas</p>
            <ul id="listaNotif" class="max-h-80 overflow-y-auto"><li class="px-2 py-3 text-sm text-slate-500">Sin novedades</li></ul>
          </div>
        </div>
        <button id="salir" class="rounded-lg px-3 py-1.5 text-sm font-semibold text-slate-500 hover:bg-slate-100">Salir</button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6">
    <div class="print-only mb-4 border-b-2 border-black pb-2">
      <h1 class="text-2xl font-bold" id="printTitulo"></h1>
      <p id="printSub"></p>
    </div>
    <div class="no-print flex flex-wrap items-end gap-3">
      <div>
        <h1 class="text-2xl font-extrabold">Citas del día</h1>
        <p id="resumen" class="text-sm text-slate-500"></p>
      </div>
      <input id="fecha" type="date" class="ml-auto rounded-xl border border-slate-300 bg-white px-3 py-2">
      <label class="flex items-center gap-2 text-sm"><input id="verTerminadas" type="checkbox" class="h-4 w-4 accent-[var(--brand)]">Ver terminadas</label>
      <button id="pdf" class="rounded-xl bg-slate-900 px-4 py-2 font-semibold text-white">Exportar PDF</button>
    </div>
    <div id="citas" class="mt-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
  </main>
  <script type="module" src="/src/dashboard.js"></script>
</body>
</html>
