<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#f3f4f9">
  <link rel="icon" href="/logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png">
  <title>Panel · Agendo</title>
</head>
<body class="tema-claro min-h-screen bg-zinc-950 text-zinc-100">
  <div class="mx-auto max-w-[1500px] md:p-5 lg:p-6">
    <header class="no-print sticky top-0 z-20 bg-zinc-900/95 shadow-[var(--sombra)] backdrop-blur md:static md:rounded-3xl">
      <div class="flex items-center gap-3 px-4 py-3 md:px-6 md:py-4">
        <span id="hdrLogo"></span>
        <div class="min-w-0">
          <p id="hdrNombre" class="truncate font-display text-base font-extrabold uppercase tracking-tight text-brand md:text-lg"></p>
          <select data-sel-negocio class="-ml-1 max-w-[11rem] truncate rounded-lg bg-transparent px-1 text-xs text-zinc-500 outline-none md:hidden"></select>
          <p id="hdrRubro" class="hidden text-xs text-zinc-500 md:block"></p>
        </div>
        <div class="ml-auto flex items-center gap-1.5 sm:gap-2">
          <button id="pdf" class="btn-ghost btn-sm hidden"></button>
          <div class="relative">
            <button id="campana" aria-label="Notificaciones" class="relative grid h-10 w-10 place-items-center rounded-full bg-zinc-800 hover:bg-zinc-700">
              <span id="campanaIcono"></span>
              <span id="badge" class="absolute -right-0.5 -top-0.5 hidden min-w-5 rounded-full bg-red-600 px-1 text-center text-xs font-bold leading-5 text-white">0</span>
            </button>
            <div id="panelNotif" class="absolute right-0 z-40 mt-2 hidden w-[min(20rem,90vw)] rounded-3xl bg-zinc-900 p-2 shadow-2xl ring-1 ring-zinc-800">
              <p class="px-3 py-2 text-xs font-semibold uppercase tracking-wider text-zinc-500">Nuevas reservas</p>
              <ul id="listaNotif" class="max-h-80 overflow-y-auto"><li class="px-3 py-3 text-sm text-zinc-500">Sin novedades</li></ul>
            </div>
          </div>
          <div class="flex items-center gap-2.5 sm:ml-2">
            <span id="avatar" class="hidden sm:grid h-10 w-10 place-items-center rounded-full bg-zinc-100 text-sm font-bold text-white"></span>
            <div class="hidden leading-tight lg:block"><p id="usuario" class="max-w-[12rem] truncate text-sm font-semibold"></p><p class="text-xs text-zinc-500">Dueño</p></div>
          </div>
          <button data-salir class="grid h-10 w-10 place-items-center rounded-full text-zinc-400 hover:bg-zinc-800 md:hidden" aria-label="Salir"></button>
        </div>
      </div>
    </header>

    <div class="md:mt-5 md:grid md:grid-cols-[14rem_minmax(0,1fr)] md:gap-5 lg:grid-cols-[15rem_minmax(0,1fr)] lg:gap-6">
      <aside class="no-print card sticky top-5 hidden h-[calc(100vh-9rem)] min-h-[30rem] flex-col p-4 md:flex">
        <select data-sel-negocio class="inp py-2.5 text-sm"></select>
        <nav id="menuLateral" class="mt-5 flex flex-col gap-1.5"></nav>
        <div class="mt-auto">
          <div id="ocupacion" class="rounded-2xl bg-zinc-950 p-4">
            <p class="text-xs font-medium text-zinc-500">Ocupación de hoy</p>
            <p id="ocupacionTxt" class="mt-1 font-display text-lg font-extrabold">—</p>
            <div class="mt-2 h-2 overflow-hidden rounded-full bg-zinc-700"><div id="ocupacionBarra" class="h-full w-0 rounded-full bg-brand transition-all duration-700"></div></div>
          </div>
          <a href="/registro?nuevo=1" class="mt-3 flex items-center gap-3 rounded-xl px-3 py-2 text-sm text-zinc-400 hover:bg-zinc-800 hover:text-zinc-100">+ Otro negocio</a>
          <button data-salir class="flex w-full items-center gap-3 rounded-xl px-3 py-2 text-sm text-zinc-400 hover:bg-zinc-800 hover:text-zinc-100"></button>
        </div>
      </aside>

      <main class="min-w-0 px-4 pb-28 pt-5 md:p-0">
        <div class="no-print mb-5"><h1 id="tituloVista" class="font-display text-2xl font-extrabold md:text-3xl"></h1><p id="subVista" class="text-sm text-zinc-500"></p></div>
        <div class="print-only mb-5 border-b-2 border-black pb-3">
          <div class="flex items-center gap-3"><span id="printLogo" class="grid h-12 w-12 place-items-center overflow-hidden rounded-xl border-2 border-black text-lg font-extrabold"></span>
            <div><p id="printNombre" class="text-2xl font-bold"></p><p id="printSub" class="text-sm"></p></div></div>
        </div>
        <div id="vista"></div>
      </main>
    </div>
  </div>

  <nav id="menuInferior" class="no-print fixed inset-x-0 bottom-0 z-30 grid grid-cols-6 border-t border-zinc-800 bg-zinc-900/95 pb-[env(safe-area-inset-bottom)] shadow-[0_-8px_30px_-12px_rgb(20_20_40/.15)] backdrop-blur md:hidden"></nav>
  <div id="modal" class="no-print fixed inset-0 z-50 hidden items-end justify-center bg-black/40 p-0 backdrop-blur-sm sm:items-center sm:p-4"></div>
  <script type="module" src="/src/dashboard.js"></script>
</body>
</html>
