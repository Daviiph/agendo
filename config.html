<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.svg"><title>Configuración · Agendo</title>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur">
    <div class="mx-auto flex max-w-4xl items-center gap-3 px-4 py-3">
      <a href="/dashboard.html" class="flex items-center gap-2 font-extrabold"><img src="/logo.svg" class="h-8 w-8" alt="">Agendo</a>
      <select id="selNegocio" class="ml-auto max-w-[45%] rounded-lg border border-slate-300 px-2 py-1.5 text-sm"></select>
      <a href="/dashboard.html" class="rounded-lg bg-slate-900 px-3 py-1.5 text-sm font-semibold text-white">Panel</a>
    </div>
  </header>
  <main class="mx-auto max-w-4xl space-y-6 px-4 py-6">
    <section class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
      <h2 class="text-lg font-bold" id="tituloNegocio">1. Tu negocio</h2>
      <form id="formNegocio" class="mt-4 grid gap-4 sm:grid-cols-2">
        <label class="text-sm font-medium sm:col-span-2">Nombre<input name="nombre" required class="inp mt-1 w-full rounded-xl border border-slate-300 px-3 py-2.5"></label>
        <label class="text-sm font-medium">Categoría<select name="categoria" id="categoria" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2.5"></select></label>
        <label class="hidden text-sm font-medium" id="wrapCustom">Tu categoría<input name="categoria_custom" id="categoriaCustom" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2.5" placeholder="Ej: Masajes"></label>
        <label class="text-sm font-medium">Color de marca
          <div class="mt-1 flex items-center gap-2"><input name="color_marca" id="color" type="color" value="#0ea5e9" class="h-11 w-16 cursor-pointer rounded-lg border border-slate-300"><span id="colorHex" class="font-mono text-sm text-slate-500">#0ea5e9</span></div>
        </label>
        <label class="text-sm font-medium">Abre<input name="hora_apertura" type="time" value="09:00" required class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2.5"></label>
        <label class="text-sm font-medium">Cierra<input name="hora_cierre" type="time" value="18:00" required class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2.5"></label>
        <label class="text-sm font-medium">Bloques cada (min)<input name="intervalo_minutos" type="number" min="5" max="240" step="5" value="30" required class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2.5"></label>
        <fieldset class="text-sm font-medium sm:col-span-2">Días de trabajo<div id="dias" class="mt-2 flex flex-wrap gap-2"></div></fieldset>
        <div class="flex flex-wrap gap-3 sm:col-span-2">
          <button class="rounded-xl bg-brand px-5 py-2.5 font-semibold text-white hover:opacity-90" id="btnNegocio">Crear negocio</button>
          <button type="button" id="btnNuevo" class="hidden rounded-xl border border-slate-300 px-5 py-2.5 font-semibold">+ Otro negocio</button>
        </div>
      </form>
    </section>

    <div id="resto" class="hidden space-y-6">
      <section class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
        <h2 class="text-lg font-bold">2. Equipo</h2>
        <form id="formEmpleado" class="mt-4 flex gap-2">
          <input name="nombre" required placeholder="Nombre del empleado" class="min-w-0 flex-1 rounded-xl border border-slate-300 px-3 py-2.5">
          <button class="rounded-xl bg-brand px-4 font-semibold text-white">Agregar</button>
        </form>
        <ul id="empleados" class="mt-4 divide-y divide-slate-100"></ul>
      </section>

      <section class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
        <h2 class="text-lg font-bold">3. Servicios</h2>
        <form id="formServicio" class="mt-4 grid grid-cols-2 gap-2 sm:grid-cols-[1fr_8rem_8rem_auto]">
          <input name="nombre" required placeholder="Ej: Corte clásico" class="col-span-2 rounded-xl border border-slate-300 px-3 py-2.5 sm:col-span-1">
          <input name="duracion_minutos" type="number" min="5" step="5" required placeholder="Minutos" class="rounded-xl border border-slate-300 px-3 py-2.5">
          <input name="precio" type="number" min="0" step="0.01" required placeholder="Precio $" class="rounded-xl border border-slate-300 px-3 py-2.5">
          <button class="col-span-2 rounded-xl bg-brand px-4 py-2.5 font-semibold text-white sm:col-span-1">Agregar</button>
        </form>
        <ul id="servicios" class="mt-4 divide-y divide-slate-100"></ul>
      </section>

      <section class="rounded-2xl bg-slate-900 p-5 text-white">
        <h2 class="text-lg font-bold">4. Comparte tu link de reservas</h2>
        <div class="mt-3 flex gap-2">
          <input id="link" readonly class="min-w-0 flex-1 rounded-xl bg-white/10 px-3 py-2.5 font-mono text-sm">
          <button id="copiar" class="rounded-xl bg-brand px-4 font-semibold">Copiar</button>
          <a id="abrir" target="_blank" class="grid place-items-center rounded-xl bg-white/10 px-4 font-semibold">Abrir</a>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="/src/config.js"></script>
</body>
</html>
